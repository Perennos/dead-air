[package]
name = "dead-air"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A local, bounded stream watchdog for off-air, frozen picture, and silence"
license = "Apache-2.0"
repository = "https://github.com/Perennos/dead-air"
readme = "README.md"
authors = ["Perennos", "Alexander Marzouca"]
publish = false
include = ["src/**", "gui/**", "brand/mark.svg", "brand/mark-dead.svg", "brand/favicon.svg", "dead-air.example.toml", "README.md", "LICENSE", "NOTICE", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "dead-air"
path = "src/main.rs"

[lib]
name = "dead_air"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
