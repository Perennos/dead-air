# type = "ntfy"
# endpoint_env = "DEAD_AIR_NTFY_URL"
# token_env = "DEAD_AIR_NTFY_TOKEN" # optional; do not commit its value
# allow_private = true # optional; still requires this exact HTTPS host:port in network.private_allowlist
#
# [[destinations]]
# id = "ops-discord"
