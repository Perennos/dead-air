name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Rust toolchain (preinstalled rustup)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Confirm local media tools
        if: runner.os != 'Windows'
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (native media and loopback suites required on Linux and macOS)
        if: runner.os != 'Windows'
        env:
          DEAD_AIR_REQUIRE_MEDIA: "1"
        run: cargo test --locked
      - name: Tests (Windows; native media suites run when FFmpeg is on PATH)
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Installer dry runs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cmd //c "install.cmd /dry-run"; else bash install.sh --dry-run; fi
      - name: Installed binary smoke check outside the checkout
        shell: bash
        run: |
          cargo build --release --locked
          BIN="$PWD/target/release/dead-air"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          WORK=$(mktemp -d)
          cd "$WORK"
          "$BIN" --version | grep -q "dead-air 0.3.0"
          "$BIN" init | grep -q '"created": true'
          "$BIN" validate --config dead-air.toml | grep -q '"ok": true'
          set +e
          "$BIN" status --config dead-air.toml --json > status.json
          code=$?
          set -e
          [ "$code" = 2 ]
          grep -q '"network_contacted": false' status.json
          [ ! -e state ]
          "$BIN" tempo policy | grep -q deadair_status
