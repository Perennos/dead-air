<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
<!-- Hallmark · component: logo mark · genre: atmospheric · theme: custom (Día de Muertos remembrance, black/red/pastels) · pre-emit critique: P5 H4 E4 S5 R4 V5 -->
<title id="t">Perennos DEAD AIR mark: a calavera built from broadcast gear. Colour-bar test cards for eye sockets, VU-meter bars for teeth, and a crown of cempasúchil petals shaped as waveform peaks.</title>
<style>:root{--red:#E10600;--marigold:#F7B32B;--rosa:#F2A1C0;--lilac:#C7B8EA;--mint:#A8E6CF;--bone:#F4EFE6;--base:#070707;--ink:#070707;--paper:#F4EFE6;--text:#F4EFE6;--dim:rgba(244,239,230,.6);--line:rgba(244,239,230,.35);--ease:cubic-bezier(.3,0,.1,1)}
.skull{fill:var(--paper);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.petal{fill:var(--marigold);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.petal.inner{fill:var(--rosa)}
.socket{fill:var(--ink)}
.cast{fill:var(--ink);opacity:.55}
.mouth{fill:var(--ink)}
.tooth{fill:var(--paper)}
.nose{fill:var(--ink)}
.bars{opacity:0}.redeye{opacity:1}
.bars{opacity:1}.redeye{opacity:0}</style>
<defs><filter id="eglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter></defs>
